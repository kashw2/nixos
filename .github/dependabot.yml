version: 2
updates:
  - package-ecosystem: github-actions
    schedule:
      interval: daily
    directories:
      - /
    cooldown:
      default-days: 7
  - package-ecosystem: nix
    open-pull-requests-limit: 50
    schedule:
      interval: weekly
    directories:
      - /
    cooldown:
      default-days: 7
      # These merge faster than the cooldown window (>100 commits in <7d), so
      # their whole fetch window stays inside cooldown and they never update.
      exclude:
        - nixpkgs
        - llm-agents
